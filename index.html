<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業 3DM 雲端檢視器</title>
    <style>
        body { margin: 0; background: #222; color: white; font-family: sans-serif; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; }
        .ui-panel { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); 
                    background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; text-align: center; width: 80%; max-width: 500px; z-index: 100; }
        input { width: 70%; padding: 8px; border: none; border-radius: 4px; }
        button { padding: 8px 15px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        #status { font-size: 12px; margin-top: 5px; color: #aaa; }
    </style>
</head>
<body>

    <div class="ui-panel">
        <input type="text" id="urlInput" placeholder="貼上 .3dm 網址">
        <button onclick="loadRhinoModel()">讀取</button>
        <div id="status">準備就緒 (支援 .3dm)</div>
    </div>

    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { Rhino3dmLoader } from 'three/addons/loaders/3DMloader.js';

        let scene, camera, renderer, controls, loader;

        init();

        function init() {
            // 初始化場景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x333333);

            // 初始化相機
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(10, 10, 10);

            // 初始化渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 控制器 (旋轉、縮放)
            controls = new OrbitControls(camera, renderer.domElement);
            
            // 光源
            const light1 = new THREE.DirectionalLight(0xffffff, 1);
            light1.position.set(1, 1, 1);
            scene.add(light1);
            const light2 = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(light2);

            // Rhino 載入器設定
            loader = new Rhino3dmLoader();
            // 這裡使用 Rhino 官方提供的解碼器程式庫
            loader.setLibraryPath('https://unpkg.com/rhino3dm@8.0.1/');

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        window.loadRhinoModel = function() {
            const url = document.getElementById('urlInput').value;
            const status = document.getElementById('status');
            
            if(!url) return alert("請輸入網址");

            status.innerText = "載入中，請稍候...";

            loader.load(url, function(object) {
                // 清除舊模型
                scene.children = scene.children.filter(c => !(c.isGroup || c.isMesh));
                scene.add(light1); // 重新補回燈光
                scene.add(light2);

                scene.add(object);
                status.innerText = "載入成功！";
                
                // 自動調整相機視角
                const box = new THREE.Box3().setFromObject(object);
                const center = box.getCenter(new THREE.Vector3());
                controls.target.copy(center);
                controls.update();
            }, 
            (progress) => {
                status.innerText = `下載中: ${Math.round(progress.loaded/progress.total*100)}%`;
            },
            (error) => {
                console.error(error);
                status.innerText = "載入失敗，請檢查網址或 CORS 權限。";
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
