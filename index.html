<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer - Auto Load</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; }
        .ui-panel { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); 
                    background: rgba(30, 30, 30, 0.8); padding: 10px 20px; border-radius: 30px; 
                    display: flex; align-items: center; z-index: 100; border: 1px solid #444; }
        input { border: none; background: transparent; color: #fff; padding: 5px; outline: none; width: 200px; }
        button { background: #007bff; color: white; border: none; border-radius: 20px; padding: 5px 15px; cursor: pointer; margin-left: 10px; }
        #status { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #00ffcc; text-shadow: 1px 1px 2px #000; }
    </style>
</head>
<body>

    <div class="ui-panel">
        <input type="text" id="urlInput" placeholder="輸入檔名或網址...">
        <button onclick="loadModelFromInput()">讀取</button>
    </div>
    <div id="status">準備就緒</div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { Rhino3dmLoader } from 'three/addons/loaders/3DMloader.js';

        let scene, camera, renderer, controls, loader;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(100, 100, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(100, 100, 100);
            scene.add(dirLight);

            loader = new Rhino3dmLoader();
            loader.setLibraryPath('https://unpkg.com/rhino3dm@8.0.1/');

            window.addEventListener('resize', onWindowResize);
            animate();

            // --- 自動載入邏輯 ---
            const urlParams = new URLSearchParams(window.location.search);
            const modelName = urlParams.get('model');
            if (modelName) {
                document.getElementById('urlInput').value = modelName;
                executeLoad(modelName);
            }
        }

        window.loadModelFromInput = function() {
            const val = document.getElementById('urlInput').value.trim();
            if(val) executeLoad(val);
        }

        function executeLoad(url) {
            const status = document.getElementById('status');
            if (url.includes('dropbox.com')) url = url.replace('dl=0', 'dl=1');
            if (!url.startsWith('http')) url = './' + url;

            status.innerText = "正在載入模型...";
            loader.load(url, function(object) {
                scene.children = scene.children.filter(c => c.type === 'AmbientLight' || c.type === 'DirectionalLight');
                object.rotation.x = -Math.PI / 2;
                scene.add(object);
                status.innerText = "載入成功！";
                
                const box = new THREE.Box3().setFromObject(object);
                const size = box.getSize(new THREE.Vector3()).length();
                const center = box.getCenter(new THREE.Vector3());
                controls.target.copy(center);
                camera.position.set(center.x + size, center.y + size, center.z + size);
                controls.update();
            }, 
            (p) => { status.innerText = `下載中: ${Math.round(p.loaded/p.total*100)}%`; },
            (e) => { status.innerText = "❌ 載入失敗，請檢查檔案是否存在"; }
            );
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
