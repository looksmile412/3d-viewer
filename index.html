<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer - Performance Plus</title>
    <style>
        body { margin: 0; background: #2a2a2a; color: white; font-family: sans-serif; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; touch-action: none; }
        .ui-panel { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); 
                    background: rgba(45, 45, 45, 0.9); padding: 8px 15px; border-radius: 25px; 
                    display: flex; align-items: center; z-index: 100; border: 1px solid #666; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        input { border: none; background: transparent; color: #fff; padding: 5px; outline: none; width: 150px; font-size: 14px; }
        button { background: #007bff; color: white; border: none; border-radius: 18px; padding: 6px 15px; cursor: pointer; margin-left: 10px; font-weight: bold; }
        #status { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 13px; color: #00ffcc; text-shadow: 1px 1px 2px #000; pointer-events: none; }
    </style>
</head>
<body>

    <div class="ui-panel">
        <input type="text" id="urlInput" placeholder="輸入檔名或網址...">
        <button onclick="loadModelFromInput()">讀取</button>
    </div>
    <div id="status">準備就緒</div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { Rhino3dmLoader } from 'three/addons/loaders/3DMloader.js';

        let scene, camera, renderer, controls, loader, mainLight;

        function init() {
            scene = new THREE.Scene();
            // 稍微調亮背景色，讓視覺更通透
            scene.background = new THREE.Color(0x333333);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 3000);
            camera.position.set(150, 150, 150);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 限制像素比以提升效能
            renderer.outputColorSpace = THREE.SRGBColorSpace; // 讓色彩更鮮艷
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; // 啟用阻尼（慣性）
            controls.dampingFactor = 0.05; // 調整這個值可以讓轉動更順滑
            controls.rotateSpeed = 0.8;

            // --- 強力燈光系統 ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5); // 環境光調強
            scene.add(ambientLight);

            mainLight = new THREE.DirectionalLight(0xffffff, 2.0); // 主燈光調強
            mainLight.position.set(1, 1, 1).normalize();
            scene.add(mainLight);

            // 加入隨相機移動的燈，保證正面永遠是亮的
            const cameraLight = new THREE.PointLight(0xffffff, 1.0);
            camera.add(cameraLight);
            scene.add(camera);

            loader = new Rhino3dmLoader();
            loader.setLibraryPath('https://unpkg.com/rhino3dm@8.0.1/');

            window.addEventListener('resize', onWindowResize);
            animate();

            const urlParams = new URLSearchParams(window.location.search);
            const modelName = urlParams.get('model');
            if (modelName) {
                document.getElementById('urlInput').value = modelName;
                executeLoad(modelName);
            }
        }

        window.loadModelFromInput = function() {
            const val = document.getElementById('urlInput').value.trim();
            if(val) executeLoad(val);
        }

        function executeLoad(url) {
            const status = document.getElementById('status');
            if (url.includes('dropbox.com')) url = url.replace('dl=0', 'dl=1');
            if (!url.startsWith('http')) url = './' + url;

            status.innerText = "正在優化並載入模型...";
            
            loader.load(url, function(object) {
                // 清理舊場景，保留基本燈光
                scene.children = scene.children.filter(c => c instanceof THREE.Light || c instanceof THREE.Camera);
                
                object.rotation.x = -Math.PI / 2; // 修正 Rhino 座標系
                
                // 遍歷模型，確保所有材質都受光且顏色鮮明
                object.traverse(child => {
                    if (child.isMesh) {
                        child.material.side = THREE.DoubleSide; // 雙面渲染，避免破面
                        if (child.material.color) child.material.color.convertSRGBToLinear();
                    }
                });

                scene.add(object);
                status.innerText = "載入成功！";
                
                // 自動對焦
                const box = new THREE.Box3().setFromObject(object);
                const size = box.getSize(new THREE.Vector3()).length();
                const center = box.getCenter(new THREE.Vector3());
                controls.target.copy(center);
                camera.position.set(center.x + size * 0.8, center.y + size * 0.8, center.z + size * 0.8);
                controls.update();
            }, 
            (p) => { 
                const percent = p.total > 0 ? Math.round(p.loaded/p.total*100) : (p.loaded / 1024 / 1024).toFixed(1);
                status.innerText = `下載中: ${percent}${p.total > 0 ? '%' : ' MB'}`; 
            },
            (e) => { status.innerText = "❌ 載入失敗，請確認檔案與網路狀態"; }
            );
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // 這是順暢轉動的關鍵
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
